@import "tailwindcss";

/* Leaflet Dark & Construction HUD Theme Tweaks */
.leaflet-container {
  background-color: #0f172a !important;
  font-family: inherit;
}

/* Custom Dark Tile Filter to make OpenStreetMap look like sleek dark GIS tiles */
.dark-gis-tiles .leaflet-tile {
  filter: brightness(0.68) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
}

.leaflet-popup-content-wrapper {
  background: #0f172a !important;
  color: #f1f5f9 !important;
  border: 1px solid rgba(245, 158, 11, 0.4) !important;
  border-radius: 0.75rem !important;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6), 0 8px 10px -6px rgba(0, 0, 0, 0.6) !important;
}

.leaflet-popup-tip {
  background: #0f172a !important;
  border: 1px solid rgba(245, 158, 11, 0.4) !important;
}

.leaflet-bar {
  border: 1px solid rgba(255, 255, 255, 0.1) !important;
  border-radius: 0.5rem !important;
  overflow: hidden;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5) !important;
}

.leaflet-bar a {
  background-color: #1e293b !important;
  color: #f8fafc !important;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
}

.leaflet-bar a:hover {
  background-color: #334155 !important;
  color: #fbbf24 !important;
}
